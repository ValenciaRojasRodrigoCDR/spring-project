<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App · Estadísticas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="orbs">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
  </div>

  <div class="app">

    <header class="hdr" style="justify-content:space-between;">
      <button class="btn" id="back-btn">← Volver</button>
      <div class="logo-txt" id="header-title">Estadísticas</div>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="avanzadas-btn">Estadísticas avanzadas</button>
        <button class="btn" id="jugadores-btn">👥 Jugadores</button>
      </div>
    </header>

    <!-- KPIs -->
    <div class="kpi-strip ha d1">
      <div class="kpi glass k1">
        <div class="kpi-lbl">Jugadores</div>
        <div class="kpi-val" id="kpi-jugadores">—</div>
        <div class="kpi-sub">En el equipo</div>
      </div>
      <div class="kpi glass k2">
        <div class="kpi-lbl">Goles totales</div>
        <div class="kpi-val" id="kpi-goles">—</div>
        <div class="kpi-sub">Del equipo</div>
      </div>
      <div class="kpi glass k3">
        <div class="kpi-lbl">Máx. goleador</div>
        <div class="kpi-val" id="kpi-max-goles">—</div>
        <div class="kpi-sub" id="kpi-max-nombre">—</div>
      </div>
      <div class="kpi glass k4">
        <div class="kpi-lbl">Más partidos</div>
        <div class="kpi-val" id="kpi-max-partidos">—</div>
        <div class="kpi-sub" id="kpi-max-partidos-nombre">—</div>
      </div>
    </div>

    <!-- CLASIFICACIÓN GOLEADORES -->
    <div class="glass full-panel ha d2">
      <div class="ptitle">Clasificación goleadores</div>
      <div class="tbl-scroll">
        <table class="tbl">
          <thead>
            <tr>
              <th>#</th>
              <th>Jugador</th>
              <th class="tr">Goles</th>
              <th class="tr">Partidos</th>
              <th class="tr">Goles/partido</th>
            </tr>
          </thead>
          <tbody id="tabla-goleadores"></tbody>
        </table>
      </div>
      <div id="goleadores-pager" style="display:none;justify-content:center;align-items:center;gap:10px;margin-top:12px;">
        <button class="btn pg-prev">‹</button>
        <span class="pg-info" style="font-size:12px;color:var(--txt2);min-width:90px;text-align:center;"></span>
        <button class="btn pg-next">›</button>
      </div>
    </div>

    <!-- CLASIFICACIÓN PARTIDOS JUGADOS -->
    <div class="glass full-panel ha d3">
      <div class="ptitle">Clasificación partidos jugados</div>
      <div class="tbl-scroll">
        <table class="tbl">
          <thead>
            <tr>
              <th>#</th>
              <th>Jugador</th>
              <th class="tr">Partidos</th>
              <th class="tr">Goles</th>
              <th class="tr">Goles/partido</th>
            </tr>
          </thead>
          <tbody id="tabla-partidos"></tbody>
        </table>
      </div>
      <div id="partidos-pager" style="display:none;justify-content:center;align-items:center;gap:10px;margin-top:12px;">
        <button class="btn pg-prev">‹</button>
        <span class="pg-info" style="font-size:12px;color:var(--txt2);min-width:90px;text-align:center;"></span>
        <button class="btn pg-next">›</button>
      </div>
    </div>


  </div>

  <script src="js/main.js"></script>
  <script>
    if (!localStorage.getItem('jwt_token')) window.location.replace('/login.html');

    const _io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vis'); _io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    document.querySelectorAll('.ha').forEach((el, i) => { setTimeout(() => _io.observe(el), i * 40); });

    const params   = new URLSearchParams(window.location.search);
    const equipoId = params.get('equipoId');

    if (!equipoId) window.location.replace('/club.html');

    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = '/club.html';
    });

    document.getElementById('jugadores-btn').addEventListener('click', () => {
      window.location.href = `/jugadores.html?equipoId=${equipoId}&from=estadisticas`;
    });

    document.getElementById('avanzadas-btn').addEventListener('click', () => {
      window.location.href = `/estadisticas-avanzadas.html?equipoId=${equipoId}`;
    });

    document.addEventListener('DOMContentLoaded', async () => {
      const [equipo, jugadores] = await Promise.all([
        apiFetch(`/equipos`),
        apiFetch(`/equipos/${equipoId}/jugadores`)
      ]);

      if (equipo) {
        const e = equipo.find(e => String(e.id) === equipoId);
        if (e) document.getElementById('header-title').textContent = e.nombre;
      }

      if (!jugadores || jugadores.length === 0) return;
      window._jugadores = jugadores;

      // KPIs
      const totalGoles = jugadores.reduce((s, j) => s + j.totalGoals, 0);
      const topGoleador = [...jugadores].sort((a, b) => b.totalGoals - a.totalGoals)[0];
      const topPartidos = [...jugadores].sort((a, b) => b.partidosJugados - a.partidosJugados)[0];

      document.getElementById('kpi-jugadores').textContent           = jugadores.length;
      document.getElementById('kpi-goles').textContent               = totalGoles;
      document.getElementById('kpi-max-goles').textContent           = topGoleador.totalGoals;
      document.getElementById('kpi-max-nombre').textContent          = topGoleador.nombre;
      document.getElementById('kpi-max-partidos').textContent        = topPartidos.partidosJugados;
      document.getElementById('kpi-max-partidos-nombre').textContent = topPartidos.nombre;

      // Tabla goleadores — paginada
      goleadoresPager.setItems([...jugadores].sort((a, b) => b.totalGoals - a.totalGoals));

      // Tabla partidos jugados — paginada
      partidosPager.setItems([...jugadores].sort((a, b) => b.partidosJugados - a.partidosJugados));
    });

    function rankClass(idx) {
      return idx === 0 ? 'rnk-primary' : idx < 3 ? 'rnk-secondary' : 'rnk-neutral';
    }

    const goleadoresPager = createPager('goleadores-pager', (pageItems, offset) => {
      document.getElementById('tabla-goleadores').innerHTML = pageItems.map((j, i) => `
        <tr>
          <td><span class="rnk ${rankClass(offset + i)}">${offset + i + 1}</span></td>
          <td>${j.nombre}</td>
          <td class="tr pts-cell">${j.totalGoals}</td>
          <td class="tr">${j.partidosJugados}</td>
          <td class="tr">${j.golPorPartido?.toFixed(2) ?? '—'}</td>
        </tr>`).join('');
    });

    const partidosPager = createPager('partidos-pager', (pageItems, offset) => {
      document.getElementById('tabla-partidos').innerHTML = pageItems.map((j, i) => `
        <tr>
          <td><span class="rnk ${rankClass(offset + i)}">${offset + i + 1}</span></td>
          <td>${j.nombre}</td>
          <td class="tr pts-cell">${j.partidosJugados}</td>
          <td class="tr">${j.totalGoals}</td>
          <td class="tr">${j.golPorPartido?.toFixed(2) ?? '—'}</td>
        </tr>`).join('');
    });
  </script>

</body>
</html>
