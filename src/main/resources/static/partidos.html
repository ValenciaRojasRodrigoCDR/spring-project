<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App · Partidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <style>
    .partido-list { display:flex; flex-direction:column; gap:12px; }
    .partido-card {
      background:var(--glass); border:1px solid var(--glass-brd);
      border-radius:var(--radius-md); padding:16px 20px;
      display:flex; flex-direction:column; gap:8px;
    }
    .partido-header { display:flex; align-items:center; justify-content:space-between; }
    .partido-rival { font-size:16px; font-weight:700; }
    .partido-result {
      font-size:22px; font-weight:900; letter-spacing:2px;
      color:#a78bfa;
    }
    .partido-meta { font-size:12px; color:var(--txt2); display:flex; gap:16px; flex-wrap:wrap; }
    .partido-actions { display:flex; gap:8px; justify-content:flex-end; }
    .btn-sm { font-size:11px; padding:4px 12px; }
    .modal-backdrop {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.55); backdrop-filter:blur(4px);
      z-index:100; align-items:center; justify-content:center;
    }
    .modal-backdrop.open { display:flex; }
    .modal {
      background:#1a1040; border:1px solid var(--glass-brd);
      border-radius:var(--radius-lg); padding:28px 32px;
      width:min(520px, 92vw); max-height:90vh; overflow-y:auto;
      display:flex; flex-direction:column; gap:14px;
    }
    .modal h3 { margin:0; font-size:17px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-group { display:flex; flex-direction:column; gap:6px; }
    .form-group label { font-size:12px; color:var(--txt2); }
    .form-group input, .form-group select {
      background:var(--glass); border:1px solid var(--glass-brd);
      border-radius:var(--radius-sm); color:var(--txt);
      padding:8px 12px; font-family:inherit; font-size:13px; outline:none;
    }
    .form-group input:focus, .form-group select:focus { border-color:#a78bfa; }
    .form-group select option { background:#1a1040; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; }
    .divider { height:1px; background:var(--glass-brd); margin:4px 0; }
    .asistencia-table { width:100%; border-collapse:collapse; font-size:13px; }
    .asistencia-table th { text-align:left; color:var(--txt2); font-weight:500; padding:4px 8px; font-size:11px; }
    .asistencia-table td { padding:6px 8px; border-top:1px solid var(--glass-brd); }
    .asistencia-table input[type=number] {
      width:52px; background:var(--glass); border:1px solid var(--glass-brd);
      border-radius:6px; color:var(--txt); padding:3px 6px;
      font-family:inherit; font-size:12px; text-align:center;
    }
    .asistencia-table input[type=checkbox] { accent-color:#a78bfa; width:15px; height:15px; cursor:pointer; }
    .empty-state { text-align:center; color:var(--txt2); padding:40px 0; font-size:14px; }
    .stats-bar {
      display:flex; gap:24px; flex-wrap:wrap;
      background:var(--glass); border:1px solid var(--glass-brd);
      border-radius:var(--radius-md); padding:14px 20px; margin-bottom:16px;
    }
    .stat-item { display:flex; flex-direction:column; gap:2px; }
    .stat-label { font-size:11px; color:var(--txt2); }
    .stat-val { font-size:18px; font-weight:700; }
  </style>
</head>
<body>

  <div class="bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="app">

    <header class="hdr">
      <div class="logo" style="cursor:pointer;" id="back-btn">
        <span style="font-size:20px;margin-right:6px;">←</span>
        <div>
          <div class="logo-txt" id="liga-title">Partidos</div>
          <div class="logo-sub">Historial de partidos</div>
        </div>
      </div>
      <div class="hdr-right">
        <button class="btn" id="new-partido-btn">+ Nuevo partido</button>
        <button class="btn" id="logout-btn" style="font-size:11px;padding:4px 12px;">Cerrar sesión</button>
      </div>
    </header>

    <div class="stats-bar" id="stats-bar" style="display:none;">
      <div class="stat-item"><div class="stat-label">Partidos</div><div class="stat-val" id="st-total">0</div></div>
      <div class="stat-item"><div class="stat-label">Victorias</div><div class="stat-val" id="st-wins" style="color:#34d399;">0</div></div>
      <div class="stat-item"><div class="stat-label">Empates</div><div class="stat-val" id="st-draws" style="color:#fbbf24;">0</div></div>
      <div class="stat-item"><div class="stat-label">Derrotas</div><div class="stat-val" id="st-losses" style="color:#f87171;">0</div></div>
      <div class="stat-item"><div class="stat-label">Goles a favor</div><div class="stat-val" id="st-gf">0</div></div>
      <div class="stat-item"><div class="stat-label">Goles en contra</div><div class="stat-val" id="st-gc">0</div></div>
    </div>

    <div class="partido-list" id="partido-list">
      <div class="empty-state">Cargando partidos...</div>
    </div>

  </div>

  <!-- Modal nuevo partido -->
  <div class="modal-backdrop" id="modal-partido">
    <div class="modal">
      <h3>Nuevo partido</h3>
      <div class="form-group">
        <label>Equipo *</label>
        <select id="f-equipo"></select>
      </div>
      <div class="form-group">
        <label>Rival *</label>
        <input type="text" id="f-rival" placeholder="Nombre del equipo rival" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="f-fecha" />
        </div>
        <div class="form-group">
          <label>Lugar</label>
          <select id="f-lugar">
            <option value="">— Seleccionar —</option>
            <option value="local">Local</option>
            <option value="visitante">Visitante</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Goles a favor</label>
          <input type="number" id="f-gf" min="0" value="0" />
        </div>
        <div class="form-group">
          <label>Goles en contra</label>
          <input type="number" id="f-gc" min="0" value="0" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-sm" id="partido-cancel" style="background:transparent;border:1px solid var(--glass-brd);">Cancelar</button>
        <button class="btn btn-sm" id="partido-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal asistencias -->
  <div class="modal-backdrop" id="modal-asistencia">
    <div class="modal">
      <h3 id="asist-title">Asistencias</h3>
      <div class="divider"></div>
      <div id="asist-content"><div class="empty-state">Cargando jugadores...</div></div>
      <div class="form-actions">
        <button class="btn btn-sm" id="asist-cancel" style="background:transparent;border:1px solid var(--glass-brd);">Cancelar</button>
        <button class="btn btn-sm" id="asist-save">Guardar asistencias</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    if (!localStorage.getItem('jwt_token')) window.location.replace('/login.html');

    const ligaId     = localStorage.getItem('current_liga_id');
    const ligaNombre = localStorage.getItem('current_liga_nombre') || 'Partidos';
    if (!ligaId) window.location.replace('/ligas.html');

    document.getElementById('liga-title').textContent = ligaNombre;
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('username');
      window.location.replace('/login.html');
    });
    document.getElementById('back-btn').addEventListener('click', () => window.location.href = '/ligas.html');

    let currentPartidoId = null;
    let currentEquipoId  = null;

    async function loadPartidos() {
      const list = document.getElementById('partido-list');
      const partidos = await apiFetch(`/ligas/${ligaId}/partidos`);
      if (!partidos || partidos.length === 0) {
        list.innerHTML = '<div class="empty-state">No hay partidos registrados.<br>Pulsa <strong>+ Nuevo partido</strong> para añadir.</div>';
        document.getElementById('stats-bar').style.display = 'none';
        return;
      }
      renderStats(partidos);
      list.innerHTML = partidos.map(p => {
        const fecha  = p.fecha ? new Date(p.fecha).toLocaleDateString('es-ES') : '—';
        const lugar  = p.lugar || '—';
        const result = p.resultado || `${p.golesFavor}-${p.golesContra}`;
        return `
        <div class="partido-card">
          <div class="partido-header">
            <div class="partido-rival">vs ${p.rival}</div>
            <div class="partido-result">${result}</div>
          </div>
          <div class="partido-meta">
            <span>📅 ${fecha}</span>
            <span>📍 ${lugar}</span>
            <span>⚽ ${p.golesFavor} - ${p.golesContra}</span>
          </div>
          <div class="partido-actions">
            <button class="btn btn-sm" onclick="openAsistencias(${p.id}, ${p.equipoId}, '${p.rival.replace(/'/g,"\\'")}')">Asistencias</button>
            <button class="btn btn-sm" style="color:#f87171;" onclick="deletePartido(${p.id})">Eliminar</button>
          </div>
        </div>`;
      }).join('');
    }

    function renderStats(partidos) {
      const bar = document.getElementById('stats-bar');
      bar.style.display = 'flex';
      let wins=0, draws=0, losses=0, gf=0, gc=0;
      for (const p of partidos) {
        gf += p.golesFavor; gc += p.golesContra;
        if (p.golesFavor > p.golesContra) wins++;
        else if (p.golesFavor === p.golesContra) draws++;
        else losses++;
      }
      document.getElementById('st-total').textContent  = partidos.length;
      document.getElementById('st-wins').textContent   = wins;
      document.getElementById('st-draws').textContent  = draws;
      document.getElementById('st-losses').textContent = losses;
      document.getElementById('st-gf').textContent     = gf;
      document.getElementById('st-gc').textContent     = gc;
    }

    async function loadEquipos() {
      const equipos = await apiFetch('/equipos');
      const sel = document.getElementById('f-equipo');
      sel.innerHTML = equipos && equipos.length
        ? equipos.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('')
        : '<option value="">Sin equipos</option>';
    }

    function openNew() {
      loadEquipos();
      document.getElementById('f-rival').value = '';
      document.getElementById('f-fecha').value = '';
      document.getElementById('f-lugar').value = '';
      document.getElementById('f-gf').value    = '0';
      document.getElementById('f-gc').value    = '0';
      document.getElementById('modal-partido').classList.add('open');
    }

    async function savePartido() {
      const equipoId = document.getElementById('f-equipo').value;
      const rival    = document.getElementById('f-rival').value.trim();
      if (!rival) { alert('El rival es obligatorio'); return; }
      const body = {
        equipoId: Number(equipoId),
        rival,
        fecha:       document.getElementById('f-fecha').value || null,
        lugar:       document.getElementById('f-lugar').value || null,
        resultado:   null,
        golesFavor:  Number(document.getElementById('f-gf').value),
        golesContra: Number(document.getElementById('f-gc').value)
      };
      await apiFetch(`/ligas/${ligaId}/partidos`, {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      closePartidoModal();
      loadPartidos();
    }

    async function deletePartido(id) {
      if (!confirm('¿Eliminar este partido?')) return;
      await apiFetch(`/ligas/${ligaId}/partidos/${id}`, { method: 'DELETE' });
      loadPartidos();
    }

    async function openAsistencias(partidoId, equipoId, rival) {
      currentPartidoId = partidoId;
      currentEquipoId  = equipoId;
      document.getElementById('asist-title').textContent = `Asistencias · vs ${rival}`;
      document.getElementById('asist-content').innerHTML = '<div class="empty-state">Cargando...</div>';
      document.getElementById('modal-asistencia').classList.add('open');

      const [jugadores, existing] = await Promise.all([
        apiFetch(`/equipos/${equipoId}/jugadores`),
        apiFetch(`/ligas/${ligaId}/partidos/${partidoId}/asistencias`)
      ]);

      const existMap = {};
      if (existing) existing.forEach(a => existMap[a.jugadorId] = a);

      if (!jugadores || jugadores.length === 0) {
        document.getElementById('asist-content').innerHTML = '<div class="empty-state">No hay jugadores en este equipo.</div>';
        return;
      }

      document.getElementById('asist-content').innerHTML = `
        <table class="asistencia-table">
          <thead><tr>
            <th>Jugador</th><th>Pos</th>
            <th style="text-align:center">Jugó</th>
            <th style="text-align:center">Titular</th>
            <th style="text-align:center">Goles</th>
            <th style="text-align:center">Min</th>
          </tr></thead>
          <tbody>
            ${jugadores.map(j => {
              const ex = existMap[j.id] || {};
              return `<tr data-jugador="${j.id}">
                <td>${j.nombre}</td>
                <td style="color:var(--txt2)">${j.posicion || '—'}</td>
                <td style="text-align:center"><input type="checkbox" class="cb-asistio" ${ex.asistio !== false ? 'checked' : ''} /></td>
                <td style="text-align:center"><input type="checkbox" class="cb-titular" ${ex.titular ? 'checked' : ''} /></td>
                <td style="text-align:center"><input type="number" class="inp-goles" min="0" value="${ex.goles || 0}" /></td>
                <td style="text-align:center"><input type="number" class="inp-minutos" min="0" value="${ex.minutos || 0}" /></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    }

    async function saveAsistencias() {
      const rows = document.querySelectorAll('#asist-content tbody tr');
      const asistencias = Array.from(rows).map(row => ({
        jugadorId: Number(row.dataset.jugador),
        asistio:   row.querySelector('.cb-asistio').checked,
        titular:   row.querySelector('.cb-titular').checked,
        goles:     Number(row.querySelector('.inp-goles').value),
        minutos:   Number(row.querySelector('.inp-minutos').value)
      }));
      await apiFetch(`/ligas/${ligaId}/partidos/${currentPartidoId}/asistencias`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ asistencias })
      });
      closeAsistenciaModal();
    }

    function closePartidoModal()   { document.getElementById('modal-partido').classList.remove('open'); }
    function closeAsistenciaModal(){ document.getElementById('modal-asistencia').classList.remove('open'); }

    document.getElementById('new-partido-btn').addEventListener('click', openNew);
    document.getElementById('partido-cancel').addEventListener('click', closePartidoModal);
    document.getElementById('partido-save').addEventListener('click', savePartido);
    document.getElementById('asist-cancel').addEventListener('click', closeAsistenciaModal);
    document.getElementById('asist-save').addEventListener('click', saveAsistencias);
    document.getElementById('modal-partido').addEventListener('click', e => { if (e.target === e.currentTarget) closePartidoModal(); });
    document.getElementById('modal-asistencia').addEventListener('click', e => { if (e.target === e.currentTarget) closeAsistenciaModal(); });

    loadPartidos();
  </script>

</body>
</html>
