spring:
  application:
    name: my-app

  datasource:
    url: jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 600000
      connection-timeout: 20000

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        id:
          optimizer:
            pooled:
              preferred: pooled-lo

server:
  port: 3000
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain
    min-response-size: 1024

app:
  jwt:
    secret: cHJvamVjdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW5zLWNoYW5nZS1pbi1wcm9kdWN0aW9u
    expiration-ms: 86400000   # 24 h
  upload-dir: uploads/jugadores
  admin:
    password: ${ADMIN_PASSWORD:changeme}

---
# Perfil local — activa con: -Dspring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
